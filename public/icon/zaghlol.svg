<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Face circle -->
  <circle cx="256" cy="260" r="160" fill="#DDF8EF"/>
  <!-- Cheeks -->
  <circle cx="200" cy="300" r="26" fill="#FFB6C1"/>
  <circle cx="312" cy="300" r="26" fill="#FFB6C1"/>
  <!-- Eyes -->
  <circle cx="210" cy="240" r="14" fill="#2C3E50"/>
  <circle cx="302" cy="240" r="14" fill="#2C3E50"/>
  <!-- Beak (teal instead of orange) -->
  <ellipse cx="256" cy="280" rx="46" ry="28" fill="#2EC4B6"/>
  <ellipse cx="256" cy="288" rx="36" ry="10" fill="#25AFA4"/>
  <!-- Tiny "ز" badge -->
  <circle cx="410" cy="118" r="28" fill="#6C63FF"/>
  <text x="410" y="126" text-anchor="middle" font-size="24" font-family="Tahoma, Arial, sans-serif" fill="#FFFFFF">ز</text>
</svg>

